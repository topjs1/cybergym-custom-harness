[project]
name = "cybergym-custom-harness"
version = "0.1.0"
description = "Small, independent AgentBeats Purple Agent harness for CyberGym"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
cybergym-custom-harness = "cybergym_harness.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybergym_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
testpaths = ["tests"]

