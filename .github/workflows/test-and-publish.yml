name: Test and Publish Agent

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"

      - name: Install locked test environment
        run: uv sync --locked --extra test

      - name: Run tests
        run: uv run pytest -q

      - name: Validate Amber manifest
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          ghcr.io/rdi-foundation/amber-cli:v0.4
          check amber-manifest.json5

      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 -t cybergym-custom-harness:ci .

      - name: Smoke-test hardened container
        run: |
          docker run --rm -d \
            --name cybergym-custom-harness-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0750 \
            -p 127.0.0.1:9009:9009 \
            -e HARNESS_LLM_MODE=mock \
            cybergym-custom-harness:ci \
            --host 0.0.0.0 --port 9009 --card-url http://127.0.0.1:9009
          timeout 30 bash -c \
            'until curl -fsS http://127.0.0.1:9009/.well-known/agent-card.json >/dev/null; do sleep 1; done'
          uv run python tools/mock_green_roundtrip.py --url http://127.0.0.1:9009

      - name: Show container logs and stop it
        if: always()
        run: |
          docker logs cybergym-custom-harness-ci || true
          docker rm -f cybergym-custom-harness-ci || true

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA::12}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=("latest")
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("$version" "${version%%.*}")
          fi
          for tag in "${tags[@]}"; do
            docker tag cybergym-custom-harness:ci "$image:$tag"
            docker push "$image:$tag"
          done
